#
# A guard for OpenOCD before it writes a Pico's flash: the chip on the probe
# must already run firmware of the same name as the ELF about to be written,
# so a RIA build never lands on the VGA, where it would drive the VGA's pins
# as the RIA's. Load it after the target and before anything programs:
#
#   -f interface/cmsis-dap.cfg -f target/rp2350.cfg -f src/host/pico/check.cfg
#   -c "rp6502_check {build/vga/rp6502-vga.elf}; program ..."
#
# The name comes from the image's binary info, as picotool reads it. Every
# Pico SDK image has a binary info header just past its vector table: a start
# marker, the bounds of the binary info table, the address of a copy table,
# and an end marker. The table's program name entry holds the name, such as
# RP6502-VGA, RP6502-RIA or RP6502-RIA-W. A copy_to_ram image, such as the
# VGA's, points into RAM, and the copy table says where in flash that RAM
# came from. The ELF's name is its file name upper-cased, which is how the
# targets are named.
#
# A chip that is blank, or that was flashed with the wrong firmware, fails the
# check too. Writing it takes a deliberate run without the check.
#
# After OpenOCD, the chip must go on running on its own. Two things stop it:
# cores left halted, and DHCSR.C_DEBUGEN left set, which makes a breakpoint
# instruction halt the core with nobody there to resume it. OpenOCD's own
# "reset" and a gdb detach both leave C_DEBUGEN set, and a detach at a
# breakpoint leaves the cores halted. rp6502_program and rp6502_release below
# leave neither.

proc rp6502_flash_addr {addr ranges} {
    foreach r $ranges {
        lassign $r src lo hi
        if {$addr >= $lo && $addr < $hi} {
            return [expr {$src + $addr - $lo}]
        }
    }
    return $addr
}

# The program name of the firmware in the chip's flash, or "" for none.
proc rp6502_program_name {} {
    set head [read_memory 0x10000000 32 256]
    for {set i 0} {$i + 4 < 256} {incr i} {
        if {[lindex $head $i] != 0x7188ebf2 ||
            [lindex $head [expr {$i + 4}]] != 0xe71aa390} {
            continue
        }
        set start [lindex $head [expr {$i + 1}]]
        set end [lindex $head [expr {$i + 2}]]
        set copy [lindex $head [expr {$i + 3}]]
        if {$start < 0x10000000 || $end <= $start || $end - $start > 4096} {
            return ""
        }
        set ranges {}
        for {set n 0} {$n < 8} {incr n} {
            lassign [read_memory [expr {$copy + 12 * $n}] 32 3] src lo hi
            if {$src == 0} {
                break
            }
            lappend ranges [list $src $lo $hi]
        }
        foreach entry [read_memory $start 32 [expr {($end - $start) / 4}]] {
            # The type 6, an ID and a string, and the tag RP, then the ID of
            # the program name.
            lassign [read_memory [rp6502_flash_addr $entry $ranges] 32 3] kind id value
            if {$kind == 0x50520006 && $id == 0x02031c86} {
                set name ""
                foreach b [read_memory [rp6502_flash_addr $value $ranges] 8 64] {
                    if {$b == 0} {
                        break
                    }
                    append name [format %c $b]
                }
                return $name
            }
        }
        return ""
    }
    return ""
}

# Stops OpenOCD with an error unless the chip runs firmware named like `elf`.
proc rp6502_check {elf} {
    init
    # A Windows path may arrive with backslashes, which file tail does not
    # split on.
    set want [string toupper [file rootname [file tail [string map {\\ /} $elf]]]]
    set have [rp6502_program_name]
    if {$have ne $want} {
        if {$have eq ""} {
            set have "no Pico SDK firmware"
        }
        echo "rp6502_check: the chip on this probe runs $have, not $want. Nothing was written."
        shutdown error
        return -code error
    }
    echo "rp6502_check: the chip on this probe runs $have."
}

# Checks, programs and verifies the ELF, then reboots the chip cold through
# the debug port: CDBGRSTREQ resets the whole chip, USB and the debug logic
# included, so it starts with C_DEBUGEN clear. The reboot happens whether or
# not programming worked, and OpenOCD then exits with an error if it failed.
proc rp6502_program {elf} {
    rp6502_check $elf
    set err [catch {program $elf verify}]
    poll off
    rp2350.dap dpreg 4 0x54000000
    rp2350.dap dpreg 4 0x50000000
    if {$err} {
        shutdown error
    } else {
        shutdown
    }
}

# For a debug session: when gdb detaches, at a breakpoint or running, the
# cores run on with C_DEBUGEN clear and OpenOCD exits, so stopping the
# debugger leaves the chip running as it was.
proc rp6502_release {} {
    rp2350.cm0 configure -event gdb-detach {
        catch resume
        poll off
        rp2350.cm0 write_memory 0xE000EDF0 32 0xA05F0000
        rp2350.cm1 write_memory 0xE000EDF0 32 0xA05F0000
        shutdown
    }
}
