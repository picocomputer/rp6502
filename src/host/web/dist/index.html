<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Picocomputer 6502</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #000; }
  #game { height: 100%; }
</style>
</head>
<body>
<div id="game"></div>
<script src="rp6502.js" onerror="document.body.textContent = 'Could not load rp6502.js'"></script>
<script>
  rp6502('game', 'adventure.rp6502', {
    title:    'Colossal Cave Adventure', // browser tab title
    db:       '',                        // saves database, such as 'username-projectname'
    bgcolor:  '000000',                  // letterbox color, six hex digits
    border:   '',                        // space around the game, such as '8px' or '1em'
    filter:   'sharp',                   // nearest | linear | sharp
    footer:   '',                        // a line of HTML under the game, with links
    github:   '',                        // repository linked in the footer, such as 'owner/repo'
    autoplay: 'on',                      // on | auto | off | muted
    install:  [],                        // more files, which the program opens as ':NAME'
    args:     [],                        // arguments for the program, such as ['-c1']
  });
</script>
</body>
</html>
