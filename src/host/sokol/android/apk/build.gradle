buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

// Not redundant with the block above, which only feeds the build script its
// own classpath. AGP resolves tools of its own at build time — aapt2 among
// them — against the project's repositories, and allprojects includes the
// root project, which in a single-module build is the app.
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.application'

// Everything Gradle generates goes to the repository's build/, which is
// already ignored, so this host needs one ignore line instead of eight.
// Three separate knobs because they are three separate mechanisms: the
// project's own output, the NDK's staging, and Gradle's project cache
// (that last one is in gradle.properties, which is where Gradle reads it).
def out = "$rootDir/../../../../../build/android"
layout.buildDirectory = file("$out/gradle")

// What this build is, from CI. Read into locals first: inside defaultConfig,
// `versionName findProperty(..) ?: ..` parses as the ternary applying to the
// call's result, not to its argument.
def rpVersion = (findProperty('rpVersion') ?: '').toString()
def rpCi = (findProperty('rpCi') ?: '').toString()
def rpVersionCode = (findProperty('rpVersionCode') ?: '1').toString() as Integer

android {
    namespace 'com.picocomputer.rp6502'
    compileSdk 35

    // Pinned in gradle.properties, which CMakeLists.txt reads too so a
    // configure without Gradle picks the same one.
    ndkVersion project.rpNdkVersion

    defaultConfig {
        applicationId "com.picocomputer.rp6502"
        minSdk project.rpMinSdk.toInteger()
        targetSdk 35
        // 0.0 is the placeholder that says nobody set a version, the same one
        // the Pocket core ships. versionCode has to be an integer under
        // 2100000000, which a CI run id is not, so only a tag moves it — and
        // nothing upgrades this APK in place anyway.
        versionName(rpVersion ?: '0.0')
        versionCode(rpVersionCode)

        externalNativeBuild {
            cmake {
                // The standard is the machine CMakeLists.txt's to set, except
                // the stamp, which only the build that was asked for it knows.
                // RP6502_GRADLE tells that file this is the Gradle way in, so it
                // does not offer an apk target that would re-enter this build.
                arguments("-DRP6502_GRADLE=ON",
                    "-DRP6502_VERSION=$rpVersion",
                    "-DRP6502_CI=$rpCi")
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            debuggable false
        }
    }

    externalNativeBuild {
        cmake {
            // The library is the machine's and this is the Android host's;
            // the APK is where the two meet, which is why it is neither.
            path "../CMakeLists.txt"
            buildStagingDirectory file("$out/cxx")
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
        }
    }
}
