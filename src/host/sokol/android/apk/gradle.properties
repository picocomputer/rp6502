# Gradle's own project cache, which build.gradle cannot move because Gradle
# reads this file before it reads that one. Sent to the same place as
# everything else generated here, so this directory stays source only.
org.gradle.projectcachedir=../../../../../build/android/cache

# The NDK and the API level, pinned. Here rather than in build.gradle because
# CMakeLists.txt has to read them too -- it picks the same NDK when it is
# configured without Gradle -- and a pin written twice is a pin that drifts.
# Unpinned means CI and a desktop can compile the same source against
# different NDKs and only one of them finds out.
rpNdkVersion=27.2.12479018
rpMinSdk=28
