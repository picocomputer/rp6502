name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PICO_SDK_VERSION: "2.3.0"
  PICO_TOOLS_TAG: "v2.3.0-0"
  ARM_TOOLCHAIN: "15.2.Rel1"

jobs:
  # ---------------------------------------------------------------------------
  # Firmware: one pico2_w build produces rp6502-ria-w.uf2 + rp6502-vga.uf2.
  # A second pico2 build is a CI-only regression check (not shipped).
  # ---------------------------------------------------------------------------
  rp6502-ria-vga:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Init firmware submodules
        run: git submodule update --init --depth 1 vendor/littlefs vendor/tinyusb

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 git ca-certificates \
            libusb-1.0-0-dev pkg-config

      - name: Install Arm GNU toolchain (${{ env.ARM_TOOLCHAIN }})
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: ${{ env.ARM_TOOLCHAIN }}

      - name: Cache Pico SDK + picotool + pioasm
        id: pico
        uses: actions/cache@v6
        with:
          path: ~/.pico-sdk
          key: pico-${{ env.PICO_SDK_VERSION }}-cyw43-lwip-btstack-mbedtls-x86_64-v1

      - name: Fetch Pico SDK ${{ env.PICO_SDK_VERSION }} + prebuilt tools
        if: steps.pico.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          SDK_DIR="$HOME/.pico-sdk/sdk/${PICO_SDK_VERSION}"
          git clone --branch "${PICO_SDK_VERSION}" --depth 1 \
            https://github.com/raspberrypi/pico-sdk "$SDK_DIR"
          git -C "$SDK_DIR" submodule update --init --depth 1 \
            lib/cyw43-driver lib/lwip lib/btstack lib/mbedtls
          # Prebuilt picotool (RP2350 .uf2 generation) and pioasm (PIO headers),
          # laid out exactly like the Pico VS Code extension's ~/.pico-sdk.
          mkdir -p "$HOME/.pico-sdk/picotool/${PICO_SDK_VERSION}" \
                   "$HOME/.pico-sdk/tools/${PICO_SDK_VERSION}"
          base="https://github.com/raspberrypi/pico-sdk-tools/releases/download/${PICO_TOOLS_TAG}"
          curl -fSL -o /tmp/picotool.tar.gz "$base/picotool-${PICO_SDK_VERSION}-x86_64-lin.tar.gz"
          tar -xzf /tmp/picotool.tar.gz -C "$HOME/.pico-sdk/picotool/${PICO_SDK_VERSION}"
          curl -fSL -o /tmp/pico-sdk-tools.tar.gz "$base/pico-sdk-tools-${PICO_SDK_VERSION}-x86_64-lin.tar.gz"
          tar -xzf /tmp/pico-sdk-tools.tar.gz -C "$HOME/.pico-sdk/tools/${PICO_SDK_VERSION}"

      - name: Derive firmware version (tag → version, off-tag → build timestamp)
        id: fwver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build firmware (pico2_w) — rp6502-ria-w + rp6502-vga
        run: |
          set -euxo pipefail
          export PICO_SDK_PATH="$HOME/.pico-sdk/sdk/${PICO_SDK_VERSION}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_BOARD=pico2_w \
            -DRP6502_VERSION="${{ steps.fwver.outputs.value }}" \
            -DPICO_SDK_PATH="$PICO_SDK_PATH" \
            -Dpicotool_DIR="$HOME/.pico-sdk/picotool/${PICO_SDK_VERSION}/picotool" \
            -Dpioasm_DIR="$HOME/.pico-sdk/tools/${PICO_SDK_VERSION}/pioasm"
          cmake --build build

      - name: Sanity build non-W RIA (pico2, not shipped)
        run: |
          set -euxo pipefail
          export PICO_SDK_PATH="$HOME/.pico-sdk/sdk/${PICO_SDK_VERSION}"
          cmake -S . -B build/pico2 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_BOARD=pico2 \
            -DRP6502_VERSION="${{ steps.fwver.outputs.value }}" \
            -DPICO_SDK_PATH="$PICO_SDK_PATH" \
            -Dpicotool_DIR="$HOME/.pico-sdk/picotool/${PICO_SDK_VERSION}/picotool" \
            -Dpioasm_DIR="$HOME/.pico-sdk/tools/${PICO_SDK_VERSION}/pioasm"
          cmake --build build/pico2

      - name: Stage firmware artifacts
        run: |
          set -euxo pipefail
          mkdir -p out
          cp build/ria/rp6502-ria-w.uf2 out/
          cp build/vga/rp6502-vga.uf2 out/

      - uses: actions/upload-artifact@v7
        with:
          name: rp6502-ria-vga
          path: out/*.uf2
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Emulator (Linux x86_64 + arm64): build the windowed emu, run the CTest suite,
  # ship a bare arch-suffixed binary.
  # ---------------------------------------------------------------------------
  linux:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Init emulator submodules
        run: |
          git submodule update --init --depth 1 \
            vendor/chips vendor/sokol vendor/imgui vendor/cppdap \
            vendor/6502_65C02_functional_tests
          git -C vendor/cppdap submodule update --init --depth 1 third_party/json

      - name: Install build + windowed-emu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libgl-dev libx11-dev libxi-dev libxcursor-dev libasound2-dev

      - name: Configure & build emulator (Release)
        run: |
          set -euxo pipefail
          cmake -S src/emu -B build/emulator/release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/emulator/release

      - name: Run emulator tests
        run: ctest --test-dir build/emulator/release --output-on-failure --parallel $(nproc)

      - name: Stage Linux emulator binary
        run: |
          set -euxo pipefail
          cp build/emulator/release/rp6502-emu "rp6502-emu-${{ matrix.arch }}"
          tar -czf "rp6502-emu-${{ matrix.arch }}.tar.gz" "rp6502-emu-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: rp6502-emu-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Emulator (macOS, arm64): build, test, wrap the binary in an unsigned .app.
  # ---------------------------------------------------------------------------
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Init emulator submodules
        run: |
          git submodule update --init --depth 1 \
            vendor/chips vendor/sokol vendor/imgui vendor/cppdap \
            vendor/6502_65C02_functional_tests
          git -C vendor/cppdap submodule update --init --depth 1 third_party/json

      - name: Configure & build emulator (Release, arm64)
        run: |
          set -euxo pipefail
          cmake -S src/emu -B build/emulator/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build/emulator/release

      - name: Run emulator tests
        run: ctest --test-dir build/emulator/release --output-on-failure --parallel $(sysctl -n hw.ncpu)

      - name: Assemble rp6502-emu.app
        run: |
          set -euxo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; else VER="0.0.0"; fi
          APP=rp6502-emu.app
          mkdir -p "$APP/Contents/MacOS"
          cp build/emulator/release/rp6502-emu "$APP/Contents/MacOS/rp6502-emu"
          chmod +x "$APP/Contents/MacOS/rp6502-emu"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>            <string>rp6502-emu</string>
              <key>CFBundleIdentifier</key>            <string>com.picocomputer.rp6502-emu</string>
              <key>CFBundleName</key>                  <string>rp6502-emu</string>
              <key>CFBundleDisplayName</key>           <string>RP6502 Emulator</string>
              <key>CFBundlePackageType</key>           <string>APPL</string>
              <key>CFBundleInfoDictionaryVersion</key> <string>6.0</string>
              <key>CFBundleShortVersionString</key>    <string>${VER}</string>
              <key>CFBundleVersion</key>               <string>${VER}</string>
              <key>LSMinimumSystemVersion</key>        <string>11.0</string>
              <key>NSHighResolutionCapable</key>       <true/>
          </dict>
          </plist>
          PLIST
          tar -czf rp6502-emu-app.tar.gz rp6502-emu.app

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: rp6502-emu-app.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Emulator (WebAssembly): build the emsdk web target, ship the itch.io bundle.
  # ---------------------------------------------------------------------------
  itch-io:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Init web-build submodules
        run: git submodule update --init --depth 1 vendor/chips vendor/sokol vendor/emsdk vendor/6502_65C02_functional_tests

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build python3

      - name: Install & activate Emscripten SDK
        run: |
          set -euxo pipefail
          ./vendor/emsdk/emsdk install latest
          ./vendor/emsdk/emsdk activate latest

      - name: Build web / itch.io bundle
        run: |
          set -exo pipefail
          source ./vendor/emsdk/emsdk_env.sh
          cd src/emu
          cmake --preset wasm
          cmake --build --preset wasm

      - name: Package itch.io bundle
        run: |
          set -euxo pipefail
          cd build/web/itch.io
          zip -r "$GITHUB_WORKSPACE/itch.io.zip" .

      - uses: actions/upload-artifact@v7
        with:
          name: itch-io
          path: itch.io.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Emulator (Windows, x64): build the D3D11 emu with MSVC + Ninja, run the
  # CTest suite, ship the bare rp6502-emu.exe.
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - name: Init emulator submodules
        shell: bash
        run: |
          git submodule update --init --depth 1 \
            vendor/chips vendor/sokol vendor/imgui vendor/cppdap vendor/wingetopt
          git -C vendor/cppdap submodule update --init --depth 1 third_party/json

      # Set up the MSVC x64 toolchain via the runner's own Visual Studio (no
      # third-party action), then build in the same step so the dev-shell env
      # (cl.exe, INCLUDE/LIB) is in scope. ctest below only runs the built exes.
      - name: Configure & build emulator (Release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          Import-Module (Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -no_logo'
          cd src/emu
          cmake --preset release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # pwsh is the default here, but this file mixes shells, and the core
      # count is spelled a different way in each of them.
      - name: Run emulator tests
        shell: pwsh
        run: ctest --test-dir build/emulator/release --output-on-failure --parallel $env:NUMBER_OF_PROCESSORS

      - name: Stage Windows emulator binary
        shell: bash
        run: |
          set -euxo pipefail
          cp build/emulator/release/rp6502-emu.exe rp6502-emu.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: rp6502-emu.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Emulator (Android, arm64-v8a): build the optimized APK, ship the APK.
  # ---------------------------------------------------------------------------
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK (Release)
        run: |
          cd src/host/android
          ./gradlew assembleRelease

      - name: Stage Android APK
        run: |
          cp src/host/android/build/outputs/apk/release/rp6502-emu-release.apk rp6502-emu.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: rp6502-emu.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # FPGA simulation: verilate the machine and run it against the emu_core oracle.
  # Needs Verilator 5 (ubuntu-24.04 carries 5.020); the verilate() call compiles
  # with -Wall, so any RTL warning fails the build.
  #
  # The longest job here by a wide margin, so it runs on the same question the
  # fit does: did src/rtl change. What it reads is wider than what it is gated
  # on — the benches are in tests/ and the oracle is emu_core out of src/emu —
  # so a commit that touches only those skips the suite that covers it. Tags
  # and dispatches run it either way.
  # ---------------------------------------------------------------------------
  test-rtl:
    needs: rtl-changes
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
      || needs['rtl-changes'].outputs.rtl == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Init simulation submodules
        run: git submodule update --init --depth 1 vendor/chips vendor/sokol vendor/hazard3 vendor/opl2_fpga vendor/6502_65C02_functional_tests

      - name: Install build dependencies + Verilator + RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build verilator \
            gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf

      # Blobless sparse clone of one directory; the full repo is 4.8 GB.
      - name: Fetch SingleStepTests CPU vectors
        run: python3 tests/cpu65/vectors.py

      - name: Configure & build simulation
        run: |
          set -euxo pipefail
          cmake --preset verilator/Release
          cmake --build --preset Tests
        working-directory: src/rtl

      - name: Run simulation tests
        run: ctest --test-dir build/verilator/release --output-on-failure --parallel $(nproc)

  # Whether this commit touched the machine. GitHub filters a whole workflow
  # by path, never one job, so the question is asked here and answered once.
  rtl-changes:
    runs-on: ubuntu-24.04
    outputs:
      rtl: ${{ steps.rtl.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did src/rtl change
        id: rtl
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          # A new branch has no before, a force push can leave one that is
          # gone, and a dispatch has none at all. Yes is the safe answer to
          # all three — a fit that was not needed costs time, one that was
          # skipped ships a stale core.
          if [[ -z "$base" ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            changed=true
          else
            # Captured rather than piped: grep -q closes early, and under
            # pipefail that returns git's SIGPIPE status, so the step would
            # fail on precisely the commits that matched.
            files=$(git diff --name-only "$base" HEAD)
            if grep -q '^src/rtl/' <<< "$files"; then changed=true; else changed=false; fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  # The bitstream, and whether it closed. Quartus writes one out either
  # way, so the slack is the thing being tested here — the .rbf_r is a
  # by-product. A fit is tens of minutes and needs a 20 GB toolchain, so it
  # runs when a diff touched the RTL, and always for a tag or a dispatch.
  #
  # src/rtl is not the whole of what decides a bitstream. The soft CPU
  # firmware compiles sources from src/ria and src/vga, and the font and
  # palette ROMs in the fabric are generated from src/vga/term — a change
  # to any of those alters the core without triggering a fit here. Tags and
  # dispatches fit unconditionally, so nothing is ever released on a core
  # this gate declined to build.
  pocket:
    needs: rtl-changes
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
      || needs['rtl-changes'].outputs.rtl == 'true'
    runs-on: ubuntu-24.04
    env:
      QUARTUS_IMAGE: raetro/quartus:21.1
    steps:
      - uses: actions/checkout@v7

      - name: Init submodules
        run: git submodule update --init --depth 1 vendor/hazard3 vendor/openfpga

      - name: Install build dependencies + RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 \
            gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf

      # Quartus is the only thing here that needs the old image, so it is the
      # only thing that goes inside it. The image is Ubuntu 16.04 and every
      # tag of it was built in one week of July 2022: its glibc is older than
      # any Node the checkout action runs on, and its archives never carried a
      # RISC-V compiler. Running the job in the container fails on the first
      # of those before it can fail on the second.
      #
      # So the container stops being the environment and becomes six programs.
      # Each shim is a docker run over the same workspace mounted at the same
      # path, which is what lets the absolute paths in the generated .qsf mean
      # the same thing on both sides of the mount. find_program() in
      # quartus.cmake takes them off PATH like any other binary — its HINTS
      # name a local install that a runner does not have.
      #
      # --user keeps what Quartus writes owned by the runner, so the host side
      # of the build can still write into the directories it created.
      - name: Quartus by way of the container
        run: |
          set -euxo pipefail
          docker pull "$QUARTUS_IMAGE"
          shims="$HOME/.quartus-shims"
          mkdir -p "$shims"
          for tool in quartus_map quartus_fit quartus_sta \
                      quartus_asm quartus_drc quartus_cdb; do
            printf '%s\n' \
              '#!/usr/bin/env bash' \
              'exec docker run --rm \' \
              '  --user "$(id -u):$(id -g)" -e HOME=/tmp \' \
              "  -v \"$GITHUB_WORKSPACE:$GITHUB_WORKSPACE\" -w \"\$PWD\" \\" \
              "  \"$QUARTUS_IMAGE\" $tool \"\$@\"" \
              > "$shims/$tool"
            chmod +x "$shims/$tool"
          done
          echo "$shims" >> "$GITHUB_PATH"
          "$shims/quartus_sta" --version

      # One preset and one target. The pocket tree is Quartus and the
      # RISC-V compiler and nothing else — no Verilator, which this runner
      # does not install and which a bitstream never needed.
      #
      # The firmware, the fit, the bitstream it goes into and the card tree
      # are one graph, so asking for the card asks for all of it in the
      # order it has to happen. A core built without the firmware boots a
      # soft CPU fetching zeros, which looks exactly like dead hardware and
      # is not.
      - name: Build the core package
        run: |
          set -euxo pipefail
          cmake --preset pocket
          cmake --build --preset "Card package"
        working-directory: src/rtl

      - uses: actions/upload-artifact@v7
        with:
          name: pocket
          path: build/pocket/package

  # ---------------------------------------------------------------------------
  # Package: fan-in every artifact into one rp6502-<version>.zip (+ SHA256SUMS).
  # ---------------------------------------------------------------------------
  package:
    needs: [rp6502-ria-vga, linux, macos, itch-io, windows, android, pocket]
    # pocket is skipped on every commit that left the RTL alone, and a skipped
    # dependency skips what depends on it unless the condition says otherwise.
    # !failure() keeps a real failure blocking, which is what needs meant on
    # its own — so a tag still waits for the fit and a fit that did not close
    # still stops the release.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: _artifacts

      - name: Assemble release zip
        run: |
          set -euxo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0+$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          mkdir stage
          # Firmware
          cp _artifacts/rp6502-ria-vga/rp6502-ria-w.uf2 stage/
          cp _artifacts/rp6502-ria-vga/rp6502-vga.uf2   stage/
          # Linux emulators (tar preserves the +x bit lost by upload-artifact)
          tar -xzf _artifacts/linux-x86_64/rp6502-emu-x86_64.tar.gz   -C stage
          tar -xzf _artifacts/linux-aarch64/rp6502-emu-aarch64.tar.gz -C stage
          chmod +x stage/rp6502-emu-x86_64 stage/rp6502-emu-aarch64
          # macOS app
          tar -xzf _artifacts/macos/rp6502-emu-app.tar.gz -C stage
          chmod +x stage/rp6502-emu.app/Contents/MacOS/rp6502-emu
          # Windows emulator
          cp _artifacts/windows/rp6502-emu.exe stage/
          # WebAssembly itch.io bundle (shipped as a nested zip)
          cp _artifacts/itch-io/itch.io.zip stage/
          # Android APK
          cp _artifacts/android/rp6502-emu.apk stage/
          # The Pocket card tree, a nested zip the way itch.io's is, with the
          # card's own root at the zip's root. Absent when the fit did not run.
          if [ -d _artifacts/pocket ]; then
            ( cd _artifacts/pocket && zip -r -y "$GITHUB_WORKSPACE/stage/pocket.zip" . )
          fi
          # Static distribution files + sample ROM
          cp src/dist/release/README.txt tests/roms/adventure.rp6502 stage/
          # One zip, everything at the root
          ( cd stage && zip -r -y "../rp6502-${VERSION}.zip" . )
          sha256sum "rp6502-${VERSION}.zip" > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: rp6502-release-zip
          path: |
            rp6502-${{ env.VERSION }}.zip
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Release: on a v* tag, publish the zip as a GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rp6502-release-zip
          path: dist

      - name: Compose release title (matches historical "Version X" format)
        id: title
        run: echo "name=Version ${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.title.outputs.name }}
          files: |
            dist/rp6502-*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Picocomputer 6502 release

            The zip contains a versioned firmware and snapshots of the emulator.
            See `README.txt` inside for instructions.
