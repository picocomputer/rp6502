name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PICO_SDK_VERSION: "2.3.0"
  PICO_TOOLS_TAG: "v2.3.0-0"
  ARM_TOOLCHAIN: "15.2.Rel1"

jobs:
  # ---------------------------------------------------------------------------
  # version: the one place the tag is parsed. Every job that stamps a binary or
  # names a release asset reads these outputs, so a build and the asset holding
  # it can never disagree about what version they are.
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      fwver: ${{ steps.v.outputs.fwver }}
      fwci: ${{ steps.v.outputs.fwci }}
    steps:
      - name: Derive version
        id: v
        run: |
          set -euo pipefail
          # version names files; fwver/fwci go to CMake, which decides every
          # version string a build says about itself. Nothing is spelled out
          # twice here any more.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "fwver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "fwci=" >> "$GITHUB_OUTPUT"
          else
            # Off a tag there is no version, and inventing one that looks like
            # a version is worse than not having it. The run id is what the
            # firmware banner already says it is, and it names a build you can
            # go and look at.
            echo "version=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "fwver=" >> "$GITHUB_OUTPUT"
            echo "fwci=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # sdk-tools: every project fetches tools/ against the hashes in SHA256SUMS,
  # so a tool edited without regenerating it breaks the update for everyone.
  # The person who would otherwise find out is a user, not the author.
  # ---------------------------------------------------------------------------
  sdk-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Verify tools/SHA256SUMS
        run: |
          set -euo pipefail
          cd tools
          grep -E '^[0-9a-f]+ ' SHA256SUMS | sha256sum -c -
          # A tool left out of SHA256SUMS hashes fine and never ships. The two
          # excluded here are the list itself and the script that writes it,
          # which is for whoever edits this directory and does not ship.
          diff <(ls | grep -v -e '^SHA256SUMS$' -e '^README\.py$' | sort) \
               <(awk '/^[0-9a-f]+ /{print $2}' SHA256SUMS | sort)

  # ---------------------------------------------------------------------------
  # pico: a pico2_w build produces rp6502-ria-w.uf2 + rp6502-vga.uf2 and a
  # pico2 build produces rp6502-ria.uf2. All three ship.
  # ---------------------------------------------------------------------------
  pico:
    needs: [version]
    runs-on: ubuntu-24.04
    env:
      ARCHIVE: rp6502-${{ needs.version.outputs.version }}-pico.zip
    steps:
      - uses: actions/checkout@v7


      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 git ca-certificates \
            libusb-1.0-0-dev pkg-config

      - name: Install Arm GNU toolchain (${{ env.ARM_TOOLCHAIN }})
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: ${{ env.ARM_TOOLCHAIN }}

      - name: Cache Pico SDK + picotool + pioasm
        id: pico
        uses: actions/cache@v6
        with:
          path: ~/.pico-sdk
          key: pico-${{ env.PICO_SDK_VERSION }}-cyw43-lwip-btstack-mbedtls-x86_64-v1

      - name: Fetch Pico SDK ${{ env.PICO_SDK_VERSION }} + prebuilt tools
        if: steps.pico.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          SDK_DIR="$HOME/.pico-sdk/sdk/${PICO_SDK_VERSION}"
          git clone --branch "${PICO_SDK_VERSION}" --depth 1 \
            https://github.com/raspberrypi/pico-sdk "$SDK_DIR"
          git -C "$SDK_DIR" submodule update --init --depth 1 \
            lib/cyw43-driver lib/lwip lib/btstack lib/mbedtls
          # Prebuilt picotool (RP2350 .uf2 generation) and pioasm (PIO headers),
          # laid out exactly like the Pico VS Code extension's ~/.pico-sdk.
          mkdir -p "$HOME/.pico-sdk/picotool/${PICO_SDK_VERSION}" \
                   "$HOME/.pico-sdk/tools/${PICO_SDK_VERSION}"
          base="https://github.com/raspberrypi/pico-sdk-tools/releases/download/${PICO_TOOLS_TAG}"
          curl -fSL -o /tmp/picotool.tar.gz "$base/picotool-${PICO_SDK_VERSION}-x86_64-lin.tar.gz"
          tar -xzf /tmp/picotool.tar.gz -C "$HOME/.pico-sdk/picotool/${PICO_SDK_VERSION}"
          curl -fSL -o /tmp/pico-sdk-tools.tar.gz "$base/pico-sdk-tools-${PICO_SDK_VERSION}-x86_64-lin.tar.gz"
          tar -xzf /tmp/pico-sdk-tools.tar.gz -C "$HOME/.pico-sdk/tools/${PICO_SDK_VERSION}"

      - name: Build firmware (pico2_w) — RIA-W + VGA
        run: |
          set -euxo pipefail
          export PICO_SDK_PATH="$HOME/.pico-sdk/sdk/${PICO_SDK_VERSION}"
          cmake -S . -B build -G Ninja \
            -DRP6502_STRICT_SUBMODULES=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_BOARD=pico2_w \
            -DRP6502_VERSION="${{ needs.version.outputs.fwver }}" \
            -DRP6502_CI="${{ needs.version.outputs.fwci }}" \
            -DPICO_SDK_PATH="$PICO_SDK_PATH" \
            -Dpicotool_DIR="$HOME/.pico-sdk/picotool/${PICO_SDK_VERSION}/picotool" \
            -Dpioasm_DIR="$HOME/.pico-sdk/tools/${PICO_SDK_VERSION}/pioasm"
          cmake --build build

      - name: Build firmware (pico2) — RIA
        run: |
          set -euxo pipefail
          export PICO_SDK_PATH="$HOME/.pico-sdk/sdk/${PICO_SDK_VERSION}"
          cmake -S . -B build/pico2 -G Ninja \
            -DRP6502_STRICT_SUBMODULES=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_BOARD=pico2 \
            -DRP6502_VERSION="${{ needs.version.outputs.fwver }}" \
            -DRP6502_CI="${{ needs.version.outputs.fwci }}" \
            -DPICO_SDK_PATH="$PICO_SDK_PATH" \
            -Dpicotool_DIR="$HOME/.pico-sdk/picotool/${PICO_SDK_VERSION}/picotool" \
            -Dpioasm_DIR="$HOME/.pico-sdk/tools/${PICO_SDK_VERSION}/pioasm"
          cmake --build build/pico2

      # The .uf2 carry the version too, not just the archive: a name you type
      # at a FLASH prompt should say which build it is.
      - name: Package pico
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euxo pipefail
          mkdir stage
          cp build/ria-w/rp6502-ria-w.uf2   "stage/rp6502-${V}-ria-w.uf2"
          cp build/pico2/ria/rp6502-ria.uf2 "stage/rp6502-${V}-ria.uf2"
          cp build/vga/rp6502-vga.uf2       "stage/rp6502-${V}-vga.uf2"
          cp src/host/pico/dist/README.txt stage/
          ( cd stage && zip -r "$GITHUB_WORKSPACE/${ARCHIVE}" . )

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          archive: false
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # linux: build the windowed emu, run the CTest suite, ship a tarball per
  # arch. The binary inside is plain rp6502-emu — the arch is the archive's
  # business, not the program's.
  # ---------------------------------------------------------------------------
  linux:
    name: linux-${{ matrix.arch }}
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    env:
      ARCHIVE: rp6502-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
    steps:
      - uses: actions/checkout@v7


      - name: Install build + windowed-emu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libgl-dev libx11-dev libxi-dev libxcursor-dev libasound2-dev

      - name: Configure & build emulator (Release)
        run: |
          set -euxo pipefail
          cmake -S src/host/sokol -B build/sokol/linux/release -G Ninja \
            -DRP6502_STRICT_SUBMODULES=ON -DCMAKE_BUILD_TYPE=Release \
            -DRP6502_VERSION="${{ needs.version.outputs.fwver }}" \
            -DRP6502_CI="${{ needs.version.outputs.fwci }}"
          cmake --build build/sokol/linux/release

      - name: Run emulator tests
        run: ctest --test-dir build/sokol/linux/release --output-on-failure --parallel $(nproc)

      # tar, not zip: it is what a Linux user expects and the only container
      # here that carries the execute bit through GitHub's artifact round-trip.
      - name: Package linux-${{ matrix.arch }}
        run: |
          set -euxo pipefail
          mkdir stage
          cp build/sokol/linux/release/rp6502-emu stage/
          cp src/host/sokol/dist/linux/README.txt stage/
          tar -czf "$ARCHIVE" -C stage rp6502-emu README.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          archive: false
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # libretro: build the core, run its suite, ship a zip per arch. No desktop
  # dev packages: this host has no window and no audio device, which is most
  # of what makes it a core. The libretro buildbot ships its own builds from
  # .gitlab-ci.yml; this job is how we find out we broke it.
  # ---------------------------------------------------------------------------
  libretro:
    name: libretro-${{ matrix.arch }}
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build

      - name: Configure & build core (Release)
        run: |
          set -euxo pipefail
          cmake -S src/host/libretro -B build/libretro/release -G Ninja \
            -DRP6502_STRICT_SUBMODULES=ON -DCMAKE_BUILD_TYPE=Release \
            -DRP6502_VERSION="${{ needs.version.outputs.fwver }}" \
            -DRP6502_CI="${{ needs.version.outputs.fwci }}"
          cmake --build build/libretro/release

      - name: Run core tests
        run: ctest --test-dir build/libretro/release --output-on-failure --parallel $(nproc)

      # The ABI is the whole export surface, and a build that grew another
      # one is a build that leaks the machine into a frontend's namespace.
      - name: Check the export surface
        run: |
          set -euxo pipefail
          nm -D --defined-only build/libretro/release/rp6502_libretro.so \
            | awk '{print $3}' | grep -v '^retro_' > unexpected.txt || true
          if [ -s unexpected.txt ]; then cat unexpected.txt; exit 1; fi

      # A folder per platform, because every core is named the same and only
      # its directory says which machine it is for. The info file and the
      # readme are identical everywhere, so they sit at the top of the bundle
      # and whichever job lands last writes them.
      - name: Stage libretro-linux-${{ matrix.arch }}
        run: |
          set -euxo pipefail
          mkdir -p stage/linux-${{ matrix.arch }}
          cp build/libretro/release/rp6502_libretro.so stage/linux-${{ matrix.arch }}/
          cp build/libretro/release/rp6502_libretro.info stage/
          cp src/host/libretro/dist/README.txt stage/

      - uses: actions/upload-artifact@v7
        with:
          name: libretro-stage-linux-${{ matrix.arch }}
          path: stage/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # libretro-windows: the same core with MSVC, and the same suite — the bench
  # opens the .dll the way a frontend does, so what passes is the artifact.
  # dumpbin is the dev shell's nm, which is why the export check enters the
  # shell a second time.
  # ---------------------------------------------------------------------------
  libretro-windows:
    needs: [version]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - name: Configure & build core (Release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          Import-Module (Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -no_logo'
          cd src/host/libretro
          cmake --preset release -DRP6502_STRICT_SUBMODULES=ON `
            "-DRP6502_VERSION=${{ needs.version.outputs.fwver }}" `
            "-DRP6502_CI=${{ needs.version.outputs.fwci }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run core tests
        shell: pwsh
        run: ctest --test-dir build/libretro/release --output-on-failure --parallel $env:NUMBER_OF_PROCESSORS

      # The ABI is the whole export surface on this linker as on every other.
      # An empty table is not a clean one, so the first thing checked is that
      # the table was read at all.
      - name: Check the export surface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          Import-Module (Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -no_logo'
          $names = (dumpbin /exports build\libretro\release\rp6502_libretro.dll) |
            Select-String '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(\S+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          if (-not ($names -contains 'retro_init')) { Write-Error 'no export table'; exit 1 }
          $bad = @($names | Where-Object { $_ -notlike 'retro_*' })
          if ($bad.Count) { $bad; exit 1 }

      - name: Stage libretro-windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory stage/windows-x86_64 -Force | Out-Null
          Copy-Item build/libretro/release/rp6502_libretro.dll stage/windows-x86_64/
          Copy-Item build/libretro/release/rp6502_libretro.info stage/
          Copy-Item src/host/libretro/dist/README.txt stage/

      - uses: actions/upload-artifact@v7
        with:
          name: libretro-stage-windows-x86_64
          path: stage/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # libretro-macos: the core on the other desktop, arm64 like the .app — the
  # buildbot's osx-x86 job covers the Intel Macs. Mach-O wears a leading
  # underscore, and this is the only continuous proof that the export list
  # ld64 takes says what the version script says everywhere else.
  # ---------------------------------------------------------------------------
  libretro-macos:
    needs: [version]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Configure & build core (Release, arm64)
        run: |
          set -euxo pipefail
          cmake -S src/host/libretro -B build/libretro/release -G Ninja \
            -DRP6502_STRICT_SUBMODULES=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DRP6502_VERSION="${{ needs.version.outputs.fwver }}" \
            -DRP6502_CI="${{ needs.version.outputs.fwci }}"
          cmake --build build/libretro/release

      - name: Run core tests
        run: ctest --test-dir build/libretro/release --output-on-failure --parallel $(sysctl -n hw.ncpu)

      - name: Check the export surface
        run: |
          set -euxo pipefail
          nm -gU build/libretro/release/rp6502_libretro.dylib | awk '{print $3}' > exports.txt
          grep -q '^_retro_init$' exports.txt   # an empty read is not a clean one
          grep -v '^_retro_' exports.txt > unexpected.txt || true
          if [ -s unexpected.txt ]; then cat unexpected.txt; exit 1; fi

      - name: Stage libretro-macos
        run: |
          set -euxo pipefail
          mkdir -p stage/macos-arm64
          cp build/libretro/release/rp6502_libretro.dylib stage/macos-arm64/
          cp build/libretro/release/rp6502_libretro.info stage/
          cp src/host/libretro/dist/README.txt stage/

      - uses: actions/upload-artifact@v7
        with:
          name: libretro-stage-macos-arm64
          path: stage/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # libretro-bundle: one zip, every platform. A core is one thing, and a
  # release page that lists it once per machine would bury the firmware and
  # the emulators under it — libretro itself builds for twenty-odd platforms,
  # so this is the shape that does not grow a row every time one is added.
  #
  # A folder per platform inside, because the core is named the same on all
  # of them and only the directory says which is which. The info file and the
  # readme are identical everywhere and sit at the top.
  # ---------------------------------------------------------------------------
  libretro-bundle:
    needs: [version, libretro, libretro-windows, libretro-macos, libretro-android]
    runs-on: ubuntu-24.04
    env:
      ARCHIVE: rp6502-${{ needs.version.outputs.version }}-libretro.zip
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: libretro-stage-*
          path: stage
          merge-multiple: true

      - name: Bundle every platform
        run: |
          set -euxo pipefail
          # Every staging job contributed, or the bundle is short a machine
          # and nobody would notice until a player did.
          for d in linux-x86_64 linux-aarch64 windows-x86_64 macos-arm64 \
                   android-arm64; do
            [ -d "stage/$d" ] || { echo "missing platform: $d" >&2; exit 1; }
          done
          test -f stage/README.txt
          # Every job generates this file and the last one merged wins, so a
          # job built without the version would quietly hand the bundle its
          # own timestamp. The version is a fact of this run; say so here.
          V='${{ needs.version.outputs.version }}'
          got=$(sed -n 's/^display_version = "\(.*\)"$/\1/p' stage/rp6502_libretro.info)
          if [ "$got" != "$V" ] && [ "$got" != "CI $V" ]; then
            echo "info says '$got', this run is '$V'" >&2
            exit 1
          fi
          (cd stage && zip -qr "$GITHUB_WORKSPACE/$ARCHIVE" .)
          unzip -l "$ARCHIVE"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          archive: false
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # libretro-android: the buildbot's other target, built with the runner's own
  # NDK. Not src/host/sokol/android/apk — that root is the APK. This is the same
  # src/host/libretro the buildbot's android template points at, driven by the
  # NDK's toolchain file. No ctest: the tests would be arm64 Android binaries,
  # so what is checked here is that it builds and exports nothing extra.
  # android-28 is the floor the APK already declares.
  # ---------------------------------------------------------------------------
  libretro-android:
    needs: [version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Configure & build core (Release, arm64-v8a)
        run: |
          set -euxo pipefail
          cmake -S src/host/libretro -B build/libretro/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DRP6502_STRICT_SUBMODULES=ON -DCMAKE_BUILD_TYPE=Release \
            -DRP6502_TESTS=OFF \
            -DRP6502_VERSION="${{ needs.version.outputs.fwver }}" \
            -DRP6502_CI="${{ needs.version.outputs.fwci }}"
          cmake --build build/libretro/android

      - name: Check the export surface
        run: |
          set -euxo pipefail
          NM="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -D --defined-only build/libretro/android/rp6502_libretro.so \
            | awk '{print $3}' > exports.txt
          grep -q '^retro_init$' exports.txt
          grep -v '^retro_' exports.txt > unexpected.txt || true
          if [ -s unexpected.txt ]; then cat unexpected.txt; exit 1; fi

      - name: Stage libretro-android
        run: |
          set -euxo pipefail
          mkdir -p stage/android-arm64
          cp build/libretro/android/rp6502_libretro.so stage/android-arm64/
          cp build/libretro/android/rp6502_libretro.info stage/
          cp src/host/libretro/dist/README.txt stage/

      - uses: actions/upload-artifact@v7
        with:
          name: libretro-stage-android-arm64
          path: stage/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macos: build and test on arm64, wrap the binary in an unsigned .app.
  # ---------------------------------------------------------------------------
  macos:
    needs: [version]
    runs-on: macos-15
    env:
      ARCHIVE: rp6502-${{ needs.version.outputs.version }}-macos.zip
    steps:
      - uses: actions/checkout@v7


      - name: Configure & build emulator (Release, arm64)
        run: |
          set -euxo pipefail
          cmake -S src/host/sokol -B build/sokol/macos/release -G Ninja \
            -DRP6502_STRICT_SUBMODULES=ON \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DRP6502_VERSION="${{ needs.version.outputs.fwver }}" \
            -DRP6502_CI="${{ needs.version.outputs.fwci }}"
          cmake --build build/sokol/macos/release

      - name: Run emulator tests
        run: ctest --test-dir build/sokol/macos/release --output-on-failure --parallel $(sysctl -n hw.ncpu)

      - name: Package macos
        run: |
          set -euxo pipefail
          mkdir stage
          # The build made the bundle; its Info.plist is osal/macos/.
          cp -R build/sokol/macos/release/rp6502-emu.app stage/
          cp src/host/sokol/dist/macos/README.txt stage/
          # ditto is the platform's own archiver: it keeps the bundle's mode
          # bits and extended attributes, which zip and upload-artifact do not.
          # No --keepParent, so stage/'s contents land at the zip root.
          ditto -c -k --sequesterRsrc stage "$ARCHIVE"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          archive: false
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # itch.io: build the emsdk web target, ship the bundle it assembles.
  # ---------------------------------------------------------------------------
  itch-io:
    name: itch.io
    needs: [version]
    runs-on: ubuntu-24.04
    env:
      ARCHIVE: rp6502-${{ needs.version.outputs.version }}-itch.io.zip
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build python3

      # No emsdk step: this root names its own toolchain file, which fetches the
      # submodule and runs install and activate itself — the path a developer
      # takes and the only one that was never exercised here. Nothing is
      # sourced either — the toolchain includes Emscripten's own cmake file,
      # so emcc is found by absolute path rather than off PATH.
      - name: Build web bundle
        run: |
          set -exo pipefail
          cd src/host/itch.io
          cmake --preset release -DRP6502_STRICT_SUBMODULES=ON \
            -DRP6502_VERSION="${{ needs.version.outputs.fwver }}" \
            -DRP6502_CI="${{ needs.version.outputs.fwci }}"
          cmake --build --preset release

      - name: Package itch.io
        run: |
          set -euxo pipefail
          cd build/itch.io/bundle
          zip -r "$GITHUB_WORKSPACE/$ARCHIVE" .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          archive: false
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # windows: build the D3D11 emu with MSVC + Ninja, run the CTest suite,
  # ship rp6502-emu.exe.
  # ---------------------------------------------------------------------------
  windows:
    needs: [version]
    runs-on: windows-2025
    env:
      ARCHIVE: rp6502-${{ needs.version.outputs.version }}-windows.zip
    steps:
      - uses: actions/checkout@v7

      # Set up the MSVC x64 toolchain via the runner's own Visual Studio (no
      # third-party action), then build in the same step so the dev-shell env
      # (cl.exe, INCLUDE/LIB) is in scope. ctest below only runs the built exes.
      - name: Configure & build emulator (Release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          Import-Module (Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -no_logo'
          cd src/host/sokol
          cmake --preset windows-release -DRP6502_STRICT_SUBMODULES=ON `
            "-DRP6502_VERSION=${{ needs.version.outputs.fwver }}" `
            "-DRP6502_CI=${{ needs.version.outputs.fwci }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # pwsh is the default here, but this file mixes shells, and the core
      # count is spelled a different way in each of them.
      - name: Run emulator tests
        shell: pwsh
        run: ctest --test-dir build/sokol/windows/release --output-on-failure --parallel $env:NUMBER_OF_PROCESSORS

      # Compress-Archive rather than bash zip: Windows ships it, and there are
      # no mode bits here worth preserving.
      - name: Package windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item build/sokol/windows/release/rp6502-emu.exe stage/
          Copy-Item src/host/sokol/dist/windows/README.txt stage/
          Compress-Archive -Path stage/* -DestinationPath "$env:ARCHIVE"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          archive: false
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # android: build the optimized arm64-v8a APK and ship it as it is.
  # ---------------------------------------------------------------------------
  android:
    needs: [version]
    runs-on: ubuntu-24.04
    env:
      ARCHIVE: rp6502-${{ needs.version.outputs.version }}-android.apk
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # versionCode must be an integer, so a tag becomes one (0.31 -> 3100) and
      # everything else stays 1. Nothing upgrades this APK in place.
      - name: Build APK (Release)
        env:
          FWVER: ${{ needs.version.outputs.fwver }}
          FWCI: ${{ needs.version.outputs.fwci }}
        run: |
          set -euxo pipefail
          CODE=1
          if [ -n "$FWVER" ]; then
            CODE=$(echo "$FWVER" | awk -F. '{printf "%d", $1*10000 + $2*100 + $3}')
          fi
          cd src/host/sokol/android/apk
          ./gradlew assembleRelease \
            -PrpVersion="${FWVER:-}" -PrpCi="${FWCI:-}" -PrpVersionCode="$CODE"

      # An APK is already a zip and Android installs it directly, so it ships
      # bare. Its install warning lives in the release body, not a README.
      - name: Package android
        run: |
          set -euxo pipefail
          cp build/android/gradle/outputs/apk/release/rp6502-emu-release.apk \
            "$ARCHIVE"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          archive: false
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # rtl-tests: verilate the machine and run its suite.
  # Needs Verilator 5 (ubuntu-24.04 carries 5.020); the verilate() call compiles
  # with -Wall, so any RTL warning fails the build.
  #
  # Ten minutes, most of it running the suite rather than building it. It used
  # to be gated on whether the diff touched anything the tree reads, which cost
  # a minute and a half of configuring to find out — the gate was worth less
  # than it cost, so it is gone and this simply runs.
  # ---------------------------------------------------------------------------
  rtl-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies + Verilator + RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build verilator \
            gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf

      - name: Configure & build simulation (Release)
        run: |
          set -euxo pipefail
          cmake --preset release -DRP6502_STRICT_SUBMODULES=ON
          cmake --build --preset release
        working-directory: tests/rtl

      - name: Run simulation tests
        run: ctest --test-dir build/rtl --output-on-failure --parallel $(nproc)

  # pocket: the bitstream, and whether it closed. Quartus writes one out either
  # way, so the slack is the thing being tested here — the .rbf_r is a
  # by-product.
  #
  # A fit is tens of minutes and needs a 20 GB toolchain, and it used to be
  # gated on whether the diff touched anything the fit reads. Answering that
  # took a job of its own that configured two trees to find out, and the
  # answer was not worth what it cost to ask.
  pocket:
    needs: [version]
    runs-on: ubuntu-24.04
    env:
      QUARTUS_IMAGE: raetro/quartus:21.1
      ARCHIVE: rp6502-${{ needs.version.outputs.version }}-pocket.zip
    steps:
      - uses: actions/checkout@v7

      # The machine's own two, and the two the generated packages come out
      # of: assets.cmake writes w65c02's decode table and the OPL2's lookup
      # ROM at configure time, and it reads chips/codegen and opl2_fpga to
      # do it. This job needs no simulator and no test fixtures, which is
      # why it is not simply test-rtl's list.
      - name: Install build dependencies + RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 \
            gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf

      # Quartus is the only thing here that needs the old image, so it is the
      # only thing that goes inside it. The image is Ubuntu 16.04 and every
      # tag of it was built in one week of July 2022: its glibc is older than
      # any Node the checkout action runs on, and its archives never carried a
      # RISC-V compiler. Running the job in the container fails on the first
      # of those before it can fail on the second.
      #
      # So the container stops being the environment and becomes six programs.
      # Each shim is a docker run over the same workspace mounted at the same
      # path, which is what lets the absolute paths in the generated .qsf mean
      # the same thing on both sides of the mount. find_program() in
      # quartus.cmake takes them off PATH like any other binary — its HINTS
      # name a local install that a runner does not have.
      #
      # --user keeps what Quartus writes owned by the runner, so the host side
      # of the build can still write into the directories it created.
      - name: Quartus by way of the container
        run: |
          set -euxo pipefail
          docker pull "$QUARTUS_IMAGE"
          shims="$HOME/.quartus-shims"
          mkdir -p "$shims"
          for tool in quartus_map quartus_fit quartus_sta \
                      quartus_asm quartus_drc quartus_cdb; do
            printf '%s\n' \
              '#!/usr/bin/env bash' \
              'exec docker run --rm \' \
              '  --user "$(id -u):$(id -g)" -e HOME=/tmp \' \
              "  -v \"$GITHUB_WORKSPACE:$GITHUB_WORKSPACE\" -w \"\$PWD\" \\" \
              "  \"$QUARTUS_IMAGE\" $tool \"\$@\"" \
              > "$shims/$tool"
            chmod +x "$shims/$tool"
          done
          echo "$shims" >> "$GITHUB_PATH"
          "$shims/quartus_sta" --version

      # One preset and the default target. The pocket tree is Quartus and the
      # RISC-V compiler and nothing else — no Verilator, which this runner
      # does not install and which a bitstream never needed.
      #
      # The firmware, the fit, the bitstream it goes into and the card tree
      # are one graph, and the card is what this root builds, so asking for it
      # asks for all of that in the order it has to happen. A core built
      # without the firmware boots a soft CPU fetching zeros, which looks
      # exactly like dead hardware and is not.
      - name: Build core package
        run: |
          set -euxo pipefail
          cmake --preset release \
            -DRP6502_VERSION="${{ needs.version.outputs.fwver }}" \
            -DRP6502_CI="${{ needs.version.outputs.fwci }}"
          cmake --build --preset release
        working-directory: src/host/pocket

      # Zipped here rather than downstream so the card's own root is the zip's
      # root, and so an empty package fails this job instead of quietly
      # shipping a release with no core in it.
      - name: Package pocket
        run: |
          set -euxo pipefail
          cd build/pocket/package
          zip -r -y "$GITHUB_WORKSPACE/$ARCHIVE" .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          archive: false
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # release: on a v* tag, collect what each job built and publish one asset per
  # target as a GitHub Release. Nothing is repacked — an archive made anywhere
  # but on its own platform loses what that platform's tool was preserving.
  #
  # This used to be two jobs, the first assembling an everything.zip for the
  # second to take apart again. That zip was for developers who wanted every
  # platform at once, and off a tag nobody wants any of it: each job already
  # uploads its own artifact, which is what a run you are watching is for. So
  # collecting happens here, once, on the only run that needs it.
  #
  # Every job named below runs unconditionally on a tag, so none can be skipped
  # and there is no absent asset to tolerate.
  #
  # Two of them build nothing this publishes and are named anyway. rtl-tests
  # is the evidence the core works, and a tag that fitted a bitstream the
  # suite rejects should not reach a release page. sdk-tools verifies the
  # checksums every project fetches tools/ against, so a broken one breaks the
  # update for everyone and the person who finds out is a user.
  # ---------------------------------------------------------------------------
  release:
    needs: [version, sdk-tools, pico, linux, libretro-bundle, macos, itch-io,
            windows, android, pocket, rtl-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # skip-decompress, because these artifacts are the assets themselves. The
      # default unpacks anything that looks like an archive, which for us is
      # every one of them.
      - uses: actions/download-artifact@v8
        with:
          path: _artifacts
          skip-decompress: true

      - name: Collect and checksum
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euxo pipefail
          mkdir dist

          # This list is the order the assets appear on the release page, and
          # checking it here is what makes a missing one a failed release rather
          # than a quiet gap in it.
          assets=()
          for w in pico.zip windows.zip macos.zip \
                   linux-x86_64.tar.gz linux-aarch64.tar.gz \
                   libretro.zip \
                   pocket.zip itch.io.zip android.apk; do
            f="rp6502-${V}-${w}"
            src=$(find _artifacts -type f -name "$f" | head -1)
            if [ -z "$src" ]; then
              echo "missing asset: $f" >&2
              exit 1
            fi
            mv "$src" "dist/$f"
            assets+=("$f")
          done

          ( cd dist && sha256sum "${assets[@]}" > SHA256SUMS )
          cat dist/SHA256SUMS

      - name: Compose release title (matches historical "Version X" format)
        id: title
        run: echo "name=Version ${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Named one by one rather than globbed: the release page lists assets in
      # upload order, and firmware belongs above the emulators.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.title.outputs.name }}
          files: |
            dist/rp6502-${{ needs.version.outputs.version }}-pico.zip
            dist/rp6502-${{ needs.version.outputs.version }}-windows.zip
            dist/rp6502-${{ needs.version.outputs.version }}-macos.zip
            dist/rp6502-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
            dist/rp6502-${{ needs.version.outputs.version }}-linux-aarch64.tar.gz
            dist/rp6502-${{ needs.version.outputs.version }}-libretro.zip
            dist/rp6502-${{ needs.version.outputs.version }}-pocket.zip
            dist/rp6502-${{ needs.version.outputs.version }}-itch.io.zip
            dist/rp6502-${{ needs.version.outputs.version }}-android.apk
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Picocomputer 6502 release

            One download per platform, each with install instructions inside.

            | Asset | |
            |---|---|
            | `rp6502-${{ needs.version.outputs.version }}-pico.zip` | RIA and VGA firmware for the Picocomputer |
            | `rp6502-${{ needs.version.outputs.version }}-windows.zip` | Emulator, Windows x64 (Direct3D 11) |
            | `rp6502-${{ needs.version.outputs.version }}-macos.zip` | Emulator, macOS 11+ Apple silicon |
            | `rp6502-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz` | Emulator, Linux x86_64 (glibc 2.35+) |
            | `rp6502-${{ needs.version.outputs.version }}-linux-aarch64.tar.gz` | Emulator, Linux aarch64 (glibc 2.35+) |
            | `rp6502-${{ needs.version.outputs.version }}-libretro.zip` | RetroArch core, every platform — or install it from the Core Downloader |
            | `rp6502-${{ needs.version.outputs.version }}-pocket.zip` | Analogue Pocket core, extract to the card root |
            | `rp6502-${{ needs.version.outputs.version }}-itch.io.zip` | Publish a program on itch.io |
            | `rp6502-${{ needs.version.outputs.version }}-android.apk` | Emulator, Android arm64 |

            The desktop builds are unsigned and the APK is signed with a debug
            key, so every OS objects on first launch. Windows: "More info" then
            "Run anyway". macOS: "Open Anyway" under Privacy & Security.
            Android: "More info" then "Install anyway".

            The emulators come with no software. 6502 programs are distributed
            as `.rp6502` files — find them on Discord, which has a forum for
            ROMs, or on itch.io under the RP6502 tag.

            - Discord: https://discord.gg/TC6X8kTr6d
            - itch.io: https://itch.io/games/tag-rp6502
            - Documentation: https://picocomputer.github.io/
