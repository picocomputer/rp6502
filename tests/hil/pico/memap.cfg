#
# SWD access to the RP2350 through the memory access ports of its cores
# alone. There are no cortex_m targets, so OpenOCD never examines, polls, or
# halts a core.
transport select swd
source [find target/swj-dp.tcl]
swj_newdap rp2350 swd -expected-id 0x00040927
dap create rp2350.dap -chain-position rp2350.swd -adiv6
target create rp2350.ahb0 mem_ap -dap rp2350.dap -ap-num 0x2000
target create rp2350.ahb1 mem_ap -dap rp2350.dap -ap-num 0x4000
